<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"> <title id="title">Debjit Modak — solar system profile</title> <desc id="desc">A dark star field with the sun at the center and programming languages orbiting around it.</desc> <defs> <radialGradient id="space" cx="50%" cy="48%" r="78%"><stop offset="0" stop-color="#111a28"/><stop offset="1" stop-color="#030712"/></radialGradient> <radialGradient id="sun"><stop offset="0" stop-color="#fff8c5"/><stop offset=".28" stop-color="#ffd65a"/><stop offset=".7" stop-color="#f4a62a" stop-opacity=".9"/><stop offset="1" stop-color="#f4a62a" stop-opacity="0"/></radialGradient> <filter id="glow"><feGaussianBlur stdDeviation="13"/></filter> <pattern id="stars" width="150" height="110" patternUnits="userSpaceOnUse"><circle cx="11" cy="18" r="1.1" fill="#fff" opacity=".7"/><circle cx="71" cy="38" r=".8" fill="#bcd6ff" opacity=".8"/><circle cx="132" cy="76" r="1" fill="#fff" opacity=".55"/><circle cx="43" cy="96" r=".7" fill="#fff" opacity=".65"/></pattern> </defs> <rect width="1200" height="650" rx="28" fill="url(#space)"/><rect width="1200" height="650" rx="28" fill="url(#stars)"/> <g fill="none" stroke="#6b7b98" stroke-opacity=".28" stroke-dasharray="3 9"><ellipse cx="600" cy="330" rx="145" ry="62"/><ellipse cx="600" cy="330" rx="255" ry="110"/><ellipse cx="600" cy="330" rx="390" ry="168"/></g> <g fill="none" stroke="#dce8ff" stroke-opacity=".32" stroke-width="2"><path d="M610 330L375 224"/><path d="M610 330L385 432"/><path d="M610 330L820 220"/><path d="M610 330L920 375"/><path d="M610 330L1010 500"/></g> <circle cx="600" cy="330" r="105" fill="#ffcb4b" opacity=".3" filter="url(#glow)"/><circle cx="600" cy="330" r="72" fill="url(#sun)"/><circle cx="600" cy="330" r="49" fill="#263246" stroke="#ffd45d" stroke-width="5"/><image href="https://github.com/debjit02-rgb.png" x="565" y="295" width="70" height="70" preserveAspectRatio="xMidYMid slice" clip-path="circle(35px at 35px 35px)"/><text x="600" y="405" text-anchor="middle" fill="#fff" font-family="monospace" font-size="16" font-weight="700">DEBJIT MODAK</text> <g font-family="monospace" font-weight="700" text-anchor="middle"><g><animateMotion dur="18s" repeatCount="indefinite" path="M0,0 C-35,-20 -20,30 0,0 C25,-30 40,20 0,0"/><circle cx="375" cy="224" r="28" fill="#3776ab" stroke="#cce7ff" stroke-width="2"/><text x="375" y="229" fill="#fff" font-size="14">PY</text><text x="375" y="270" fill="#d7e2f4" font-size="13">Python · 30%</text></g><g><animateMotion dur="14s" repeatCount="indefinite" path="M0,0 C25,35 -30,45 0,0 C25,-35 35,-25 0,0"/><circle cx="385" cy="432" r="28" fill="#f7df1e"/><text x="385" y="437" fill="#111827" font-size="14">JS</text><text x="385" y="478" fill="#d7e2f4" font-size="13">JavaScript · 50%</text></g><g><animateMotion dur="20s" repeatCount="indefinite" path="M0,0 C30,22 20,-28 0,0 C-30,-20 -35,25 0,0"/><circle cx="820" cy="220" r="28" fill="#a78bfa" stroke="#efe8ff" stroke-width="2"/><text x="820" y="225" fill="#fff" font-size="14">CSS</text><text x="820" y="265" fill="#d7e2f4" font-size="13">CSS · 4%</text></g><g><animateMotion dur="16s" repeatCount="indefinite" path="M0,0 C-28,25 35,35 0,0 C-25,-30 -35,-15 0,0"/><circle cx="920" cy="375" r="28" fill="#2f80ed" stroke="#dbeafe" stroke-width="2"/><text x="920" y="380" fill="#fff" font-size="14">C++</text><text x="920" y="420" fill="#d7e2f4" font-size="13">C++ · 10%</text></g><g><animateMotion dur="22s" repeatCount="indefinite" path="M0,0 C-30,-25 35,-35 0,0 C30,25 -35,30 0,0"/><circle cx="1010" cy="500" r="28" fill="#5b8def" stroke="#dbeafe" stroke-width="2"/><text x="1010" y="505" fill="#fff" font-size="14">C</text><text x="1010" y="545" fill="#d7e2f4" font-size="13">C · 6%</text></g></g> <text x="38" y="48" fill="#f7ca52" font-family="monospace" font-size="15" letter-spacing="3">SOLAR SYSTEM · @DEBJIT02-RGB</text><text x="38" y="610" fill="#a9b8cf" font-family="monospace" font-size="13">planets = languages · moons =